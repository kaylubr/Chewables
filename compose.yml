name: chewable

services:
  db:
    image: postgres:18.6-alpine3.23
    environment:
      POSTGRES_USER: chewables
      POSTGRES_PASSWORD: chewables
      POSTGRES_DB: chewables
    ports:
      - "5434:5432"
    volumes:
      - db-data:/var/lib/postgresql

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: chewables
      MINIO_ROOT_PASSWORD: chewables-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  db-data:
  minio-data:
