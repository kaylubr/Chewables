<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Finishing sign-in</title>
		<style>
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				font-family: system-ui, sans-serif;
				background: #fafafa;
				color: #1a1a1a;
			}
			main {
				text-align: center;
				padding: 1.5rem;
			}
			p {
				margin: 0 0 0.5rem;
			}
			a {
				color: #c31b1b;
			}
		</style>
	</head>
	<body>
		<main>
			<p id="status">Finishing your sign-in…</p>
			<a id="back" href="/login" hidden>Back to sign in</a>
		</main>
		<script>
			// Lightweight landing page for the Google sign-in popup (and the
			// full-page fallback). Must stay dependency-free: it reads the
			// session via the API and tells the opener to continue, without
			// booting the SvelteKit app.
			(function () {
				const SOURCE = 'chewable-google-auth';
				const FAILED = 'Sign-in did not complete. Please try again.';
				const params = new URLSearchParams(location.search);
				const api = params.get('api') || location.origin;
				const next = params.get('next');
				const target = next && next.startsWith('/') && !next.startsWith('//') ? next : '/photos';

				async function finish() {
					let user = null;
					let problem = null;
					try {
						const res = await fetch(api + '/api/auth/me', { credentials: 'include' });
						if (res.ok) {
							user = await res.json();
						} else if (res.status !== 401) {
							problem = FAILED;
						}
					} catch {
						problem = FAILED;
					}
					if (window.opener) {
						window.opener.postMessage(
							user
								? { source: SOURCE, status: 'success', user }
								: { source: SOURCE, status: 'error', message: problem || FAILED },
							location.origin
						);
						window.close();
						return;
					}
					if (user) {
						location.replace(target);
						return;
					}
					document.getElementById('status').textContent = problem || FAILED;
					document.getElementById('back').hidden = false;
				}
				finish();
			})();
		</script>
	</body>
</html>
